# Profile: the settings one sandboxed agent runs with. Every line is optional.
BASE_URL=http://172.16.10.46:40115/v1   # OpenAI-compatible endpoint (Olla, llama-swap, ...) the agent talks to
MODEL=qwen36_35B_reap48_v2        # a model that endpoint serves
CONTEXT=49152                     # context window goharness assumes
ROUNDS=30                         # tool rounds per message
SUBAGENT_MODEL=gemma4_12B_qat     # model for spawn_agent subagents (must exist on both hosts)
PARALLEL=2                        # subagents that may run at the same time
NETWORK=olla-only                 # olla-only = can reach Olla and nothing else | open = normal Docker networking
MEMORY=4g
SKILLS_DIR=$HOME/.goharness/skills   # host folder of skill folders, mounted read-only
PERMISSIONS_FILE=                 # host permissions.json copied to the agent's config
RULES_FILES=                      # project files (relative to the project, or absolute) turned into a "project-rules" skill
